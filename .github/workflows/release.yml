name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            output: contexa-linux-x64

          - os: macos-latest
            label: macos-arm64
            output: contexa-macos-arm64

          - os: windows-latest
            label: win-x64
            output: contexa-win-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: runner.os == 'Linux'
        with:
          gradle-version: '8.14.3'

      - run: npm install

      - name: Validate release contract
        shell: bash
        run: |
          node -e "const m=require('./release-manifest.json'); const p=require('./package.json'); if (m.cliVersion !== p.version) throw new Error('manifest/package CLI version mismatch'); if (m.releaseTag !== process.env.GITHUB_REF_NAME) throw new Error('manifest/tag mismatch'); if (!m.starter.version.endsWith('-SNAPSHOT')) throw new Error('snapshot channel requires SNAPSHOT starter'); if (!m.signature.required || m.signature.algorithm !== 'RSA-3072-SHA256') throw new Error('signed release manifest is required')"

      - name: Run unit tests
        run: npm test

      - name: Validate Phase 2 interactive and build models
        if: runner.os == 'Linux'
        shell: bash
        env:
          CONTEXA_TRANSCRIPT_DIR: phase2-evidence/interactive
          CONTEXA_BUILD_MODEL_DIR: phase2-evidence/build-models
        run: |
          set -euo pipefail
          mkdir -p "$CONTEXA_TRANSCRIPT_DIR" "$CONTEXA_BUILD_MODEL_DIR"
          node test/interactive-defaults.cjs
          node test/build-models.cjs

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: phase2-acceptance-evidence
          path: phase2-evidence/

      - name: Bundle
        run: npx esbuild src/index.js --bundle --platform=node --target=node18 --outfile=dist/bundle.js --format=cjs

      - name: SEA blob
        run: node --experimental-sea-config sea-config.json

      - name: Build binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          cp $(which node) dist/${{ matrix.output }}
          npx postject dist/${{ matrix.output }} NODE_SEA_BLOB dist/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            ${{ runner.os == 'macOS' && '--macho-segment-name NODE_SEA' || '' }}
          chmod +x dist/${{ matrix.output }}
          ${{ runner.os == 'macOS' && 'codesign --sign - dist/' || 'echo done #' }}${{ matrix.output }}

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          copy "$env:programfiles\nodejs\node.exe" dist\${{ matrix.output }}
          npx postject dist\${{ matrix.output }} NODE_SEA_BLOB dist\sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Verify binary architecture and smoke (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/${{ matrix.output }}"
          description="$(file "$binary")"
          echo "$description"
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "$description" | grep -Eiq 'x86[-_ ]64|x86-64'
          else
            echo "$description" | grep -Eiq 'arm64|aarch64'
          fi
          expected="$(node -p "require('./release-manifest.json').cliVersion")"
          test "$("$binary" --version)" = "$expected"
          "$binary" --help >/dev/null

      - name: Verify binary architecture and smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "dist/${{ matrix.output }}"
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Expected PE x64 machine 0x8664, got 0x$($machine.ToString('x4'))" }
          $expected = (Get-Content release-manifest.json -Raw | ConvertFrom-Json).cliVersion
          $reported = (& $binary --version | Select-Object -First 1).Trim()
          if ($reported -ne $expected) { throw "CLI version mismatch: expected=$expected actual=$reported" }
          & $binary --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "Windows binary --help failed" }
          $signatureStatus = (Get-AuthenticodeSignature $binary).Status.ToString()
          if ($signatureStatus -ne 'NotSigned') { throw "Snapshot contract expected NotSigned, got $signatureStatus" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/

      # Generate SHA-256 sidecars next to each binary so the install-ctxa
      # installers (install.sh / install.ps1) can verify the download against
      # a tamper-evident digest before chmod +x.
      - name: Generate SHA-256 checksums
        run: |
          set -e
          for f in \
              dist/contexa-linux-x64/contexa-linux-x64 \
              dist/contexa-macos-arm64/contexa-macos-arm64 \
              dist/contexa-win-x64.exe/contexa-win-x64.exe; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            echo "$(cat "$f.sha256")  $(basename "$f")"
          done

      - name: Bind asset digests into release manifest
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const manifest = require('./release-manifest.json');
          for (const asset of manifest.assets) {
            const binaryPath = path.join('dist', asset.file, asset.file);
            if (!fs.existsSync(binaryPath)) throw new Error('missing release asset: ' + binaryPath);
            asset.sha256 = crypto.createHash('sha256').update(fs.readFileSync(binaryPath)).digest('hex');
          }
          fs.writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Sign and verify release manifest
        shell: bash
        env:
          RELEASE_MANIFEST_SIGNING_KEY: ${{ secrets.RELEASE_MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_MANIFEST_SIGNING_KEY"
          umask 077
          key_file="$(mktemp)"
          signature_file="$(mktemp)"
          trap 'rm -f "$key_file" "$signature_file" derived-public.pem' EXIT
          printf '%s' "$RELEASE_MANIFEST_SIGNING_KEY" > "$key_file"
          openssl pkey -in "$key_file" -pubout -out derived-public.pem
          cmp derived-public.pem release-signing-public.pem
          openssl dgst -sha256 -sign "$key_file" -out "$signature_file" release-manifest.json
          openssl base64 -A -in "$signature_file" -out release-manifest.json.sig
          openssl dgst -sha256 -verify release-signing-public.pem -signature "$signature_file" release-manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          name: Contexa CLI ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install
            ```bash
            curl -fsSL https://install.ctxa.ai | sh
            ```
            The installer verifies the RSA-signed release manifest and the SHA-256 digest bound to each binary.
          files: |
            release-manifest.json
            release-manifest.json.sig
            release-signing-public.pem
            dist/contexa-linux-x64/contexa-linux-x64
            dist/contexa-linux-x64/contexa-linux-x64.sha256
            dist/contexa-macos-arm64/contexa-macos-arm64
            dist/contexa-macos-arm64/contexa-macos-arm64.sha256
            dist/contexa-win-x64.exe/contexa-win-x64.exe
            dist/contexa-win-x64.exe/contexa-win-x64.exe.sha256
