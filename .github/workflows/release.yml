name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            output: contexa-linux-x64

          - os: macos-latest
            label: macos-arm64
            output: contexa-macos-arm64

          - os: windows-latest
            label: win-x64
            output: contexa-win-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: runner.os == 'Linux'
        with:
          gradle-version: '8.14.3'

      - run: npm install

      - name: Bind source provenance
        shell: bash
        run: |
          node -e "const f=require('fs'),p='release-manifest.json',m=JSON.parse(f.readFileSync(p));m.source.commit=process.env.GITHUB_SHA;f.writeFileSync(p,JSON.stringify(m,null,2)+'\n')"

      - name: Validate release contract
        shell: bash
        run: |
          node -e "const m=require('./release-manifest.json'); const p=require('./package.json'); if (m.cliVersion !== p.version) throw new Error('manifest/package CLI version mismatch'); if (m.releaseTag !== process.env.GITHUB_REF_NAME) throw new Error('manifest/tag mismatch'); if (!m.starter.version.endsWith('-SNAPSHOT')) throw new Error('snapshot channel requires SNAPSHOT starter'); if (!m.signature.required || m.signature.algorithm !== 'RSA-3072-SHA256') throw new Error('signed release manifest is required'); if(m.source.repository!==process.env.GITHUB_REPOSITORY||m.source.commit!==process.env.GITHUB_SHA)throw new Error('source provenance mismatch')"

      - name: Run Phase 5 focused regression tests
        if: contains(github.ref_name, '-phase5.')
        run: node --test test/phase5-contract.test.js test/preflight.test.js test/ollama.test.js

      - name: Run Phase 5 project identity regression
        if: contains(github.ref_name, '-phase5.')
        run: node --test --test-name-pattern="S3:" test/sideeffect-zero.test.js

      - name: Download the Phase 6 verified GeoLite2 fixture
        if: contains(github.ref_name, '-phase6.')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase6-evidence
          geo_url="$(node -p "require('./release-manifest.json').resources.geoIp.url")"
          geo_sha="$(node -p "require('./release-manifest.json').resources.geoIp.sha256")"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            "$geo_url" --output phase6-evidence/GeoLite2-City.mmdb
          node -e "const c=require('crypto'),f=require('fs');const actual=c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex');if(actual!==process.argv[2])throw new Error('GeoLite2 checksum mismatch')" \
            phase6-evidence/GeoLite2-City.mmdb "$geo_sha"

      - name: Run Phase 6 state-transition acceptance
        if: contains(github.ref_name, '-phase6.')
        shell: bash
        env:
          CONTEXA_TEST_GEOLITE2_SOURCE_PATH: ${{ github.workspace }}/phase6-evidence/GeoLite2-City.mmdb
          CONTEXA_PHASE6_EVIDENCE_DIR: ${{ github.workspace }}/phase6-evidence/state-transitions
        run: |
          set -o pipefail
          node --test test/phase6-state-transitions.test.js 2>&1 | tee phase6-evidence/state-transitions.tap

      - name: Publish Phase 6 failure detail
        if: failure() && contains(github.ref_name, '-phase6.')
        shell: bash
        run: |
          node -e "const f=require('fs');const p='phase6-evidence/state-transitions.tap';const s=f.existsSync(p)?f.readFileSync(p,'utf8').slice(-12000):'TAP output is missing';const e=s.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');console.log('::error file=test/phase6-state-transitions.test.js,line=1,title=Phase 6 state transition failure::'+e)"

      - uses: actions/upload-artifact@v4
        if: always() && contains(github.ref_name, '-phase6.')
        with:
          name: phase6-state-transition-evidence-${{ matrix.label }}
          path: phase6-evidence/

      - name: Run full regression tests for stable or unclassified releases
        if: ${{ !contains(github.ref_name, '-phase5.') && !contains(github.ref_name, '-phase6.') }}
        run: npm test

      - name: Validate Phase 2 interactive and build models
        if: runner.os == 'Linux' && (!contains(github.ref_name, '-phase') || contains(github.ref_name, '-phase2.'))
        shell: bash
        env:
          CONTEXA_TRANSCRIPT_DIR: phase2-evidence/interactive
          CONTEXA_BUILD_MODEL_DIR: phase2-evidence/build-models
        run: |
          set -euo pipefail
          mkdir -p "$CONTEXA_TRANSCRIPT_DIR" "$CONTEXA_BUILD_MODEL_DIR"
          node test/interactive-defaults.cjs
          node test/build-models.cjs

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && (!contains(github.ref_name, '-phase') || contains(github.ref_name, '-phase2.'))
        with:
          name: phase2-acceptance-evidence
          path: phase2-evidence/

      - name: Validate Phase 3 reset ownership and recovery
        if: runner.os == 'Linux' && (!contains(github.ref_name, '-phase') || contains(github.ref_name, '-phase3.'))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3-evidence
          node --test test/reset-phase3.test.js > phase3-evidence/reset-phase3.tap

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && (!contains(github.ref_name, '-phase') || contains(github.ref_name, '-phase3.'))
        with:
          name: phase3-acceptance-evidence
          path: phase3-evidence/

      - name: Validate Phase 4 simulation isolation
        if: runner.os == 'Linux' && (!contains(github.ref_name, '-phase') || contains(github.ref_name, '-phase4.'))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase4-evidence
          geo_url="$(node -p "require('./release-manifest.json').resources.geoIp.url")"
          geo_sha="$(node -p "require('./release-manifest.json').resources.geoIp.sha256")"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            "$geo_url" --output phase4-evidence/GeoLite2-City.mmdb
          echo "$geo_sha  phase4-evidence/GeoLite2-City.mmdb" | sha256sum --check
          CONTEXA_TEST_GEOLITE2_SOURCE_PATH="$PWD/phase4-evidence/GeoLite2-City.mmdb" \
            node --test --test-name-pattern "normal and simulation command states coexist" \
            test/phase0-contract.test.js > phase4-evidence/simulation-coexistence.tap

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && (!contains(github.ref_name, '-phase') || contains(github.ref_name, '-phase4.'))
        with:
          name: phase4-acceptance-evidence
          path: phase4-evidence/

      - name: Run final full source regression once
        if: runner.os == 'Linux'
        run: npm test

      - name: Bundle
        run: npx esbuild src/index.js --bundle --platform=node --target=node18 --outfile=dist/bundle.js --format=cjs

      - name: SEA blob
        run: node --experimental-sea-config sea-config.json

      - name: Build binary (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          cp $(which node) dist/${{ matrix.output }}
          npx postject dist/${{ matrix.output }} NODE_SEA_BLOB dist/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            ${{ runner.os == 'macOS' && '--macho-segment-name NODE_SEA' || '' }}
          chmod +x dist/${{ matrix.output }}
          ${{ runner.os == 'macOS' && 'codesign --sign - dist/' || 'echo done #' }}${{ matrix.output }}

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          copy "$env:programfiles\nodejs\node.exe" dist\${{ matrix.output }}
          npx postject dist\${{ matrix.output }} NODE_SEA_BLOB dist\sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Run Phase 6 exact commands against the built binary
        if: runner.os == 'Linux' && contains(github.ref_name, '-phase6.')
        shell: bash
        env:
          CONTEXA_CLI_EXECUTABLE: ${{ github.workspace }}/dist/${{ matrix.output }}
          CONTEXA_TEST_GEOLITE2_SOURCE_PATH: ${{ github.workspace }}/phase6-evidence/GeoLite2-City.mmdb
          CONTEXA_TRANSCRIPT_DIR: ${{ github.workspace }}/phase6-evidence/interactive
          CONTEXA_PHASE6_ACTUAL_DOCKER: '1'
        run: |
          set -o pipefail
          node test/interactive-defaults.cjs 2>&1 | tee phase6-evidence/interactive-acceptance.log

      - name: Verify binary architecture and smoke (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/${{ matrix.output }}"
          description="$(file "$binary")"
          echo "$description"
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "$description" | grep -Eiq 'x86[-_ ]64|x86-64'
          else
            echo "$description" | grep -Eiq 'arm64|aarch64'
          fi
          expected="$(node -p "require('./release-manifest.json').cliVersion")"
          test "$("$binary" --version)" = "$expected"
          "$binary" --help >/dev/null

      - name: Verify binary architecture and smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "dist/${{ matrix.output }}"
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Expected PE x64 machine 0x8664, got 0x$($machine.ToString('x4'))" }
          $expected = (Get-Content release-manifest.json -Raw | ConvertFrom-Json).cliVersion
          $reported = (& $binary --version | Select-Object -First 1).Trim()
          if ($reported -ne $expected) { throw "CLI version mismatch: expected=$expected actual=$reported" }
          & $binary --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "Windows binary --help failed" }
          $signatureStatus = (Get-AuthenticodeSignature $binary).Status.ToString()
          if ($signatureStatus -ne 'NotSigned') { throw "Snapshot contract expected NotSigned, got $signatureStatus" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: contexa-snapshot-channel
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bind source provenance
        shell: bash
        run: |
          node -e "const f=require('fs'),p='release-manifest.json',m=JSON.parse(f.readFileSync(p));m.source.commit=process.env.GITHUB_SHA;f.writeFileSync(p,JSON.stringify(m,null,2)+'\n')"

      - uses: actions/download-artifact@v4
        with:
          path: dist/

      # Generate SHA-256 sidecars next to each binary so the install-ctxa
      # installers (install.sh / install.ps1) can verify the download against
      # a tamper-evident digest before chmod +x.
      - name: Generate SHA-256 checksums
        run: |
          set -e
          for f in \
              dist/contexa-linux-x64/contexa-linux-x64 \
              dist/contexa-macos-arm64/contexa-macos-arm64 \
              dist/contexa-win-x64.exe/contexa-win-x64.exe; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            echo "$(cat "$f.sha256")  $(basename "$f")"
          done

      - name: Bind asset digests into release manifest
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const manifest = require('./release-manifest.json');
          for (const asset of manifest.assets) {
            const binaryPath = path.join('dist', asset.file, asset.file);
            if (!fs.existsSync(binaryPath)) throw new Error('missing release asset: ' + binaryPath);
            asset.sha256 = crypto.createHash('sha256').update(fs.readFileSync(binaryPath)).digest('hex');
          }
          fs.writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Sign and verify release manifest
        shell: bash
        env:
          RELEASE_MANIFEST_SIGNING_KEY: ${{ secrets.RELEASE_MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_MANIFEST_SIGNING_KEY"
          umask 077
          key_file="$(mktemp)"
          signature_file="$(mktemp)"
          channel_signature_file="$(mktemp)"
          trap 'rm -f "$key_file" "$signature_file" "$channel_signature_file" derived-public.pem' EXIT
          printf '%s' "$RELEASE_MANIFEST_SIGNING_KEY" > "$key_file"
          openssl pkey -in "$key_file" -pubout -out derived-public.pem
          cmp derived-public.pem release-signing-public.pem
          openssl dgst -sha256 -sign "$key_file" -out "$signature_file" release-manifest.json
          openssl base64 -A -in "$signature_file" -out release-manifest.json.sig
          openssl dgst -sha256 -verify release-signing-public.pem -signature "$signature_file" release-manifest.json
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const releaseBytes = fs.readFileSync('release-manifest.json');
          const release = JSON.parse(releaseBytes);
          if (release.channel !== 'snapshot') throw new Error('snapshot release channel is required');
          const channel = {
            schemaVersion: 1,
            channel: release.channel,
            releaseTag: release.releaseTag,
            cliVersion: release.cliVersion,
            starterVersion: release.starter.version,
            sourceCommit: release.source.commit,
            releaseManifestSha256: crypto.createHash('sha256').update(releaseBytes).digest('hex'),
          };
          fs.writeFileSync('channel-manifest.json', JSON.stringify(channel, null, 2) + '\n');
          NODE
          openssl dgst -sha256 -sign "$key_file" -out "$channel_signature_file" channel-manifest.json
          openssl base64 -A -in "$channel_signature_file" -out channel-manifest.json.sig
          openssl dgst -sha256 -verify release-signing-public.pem -signature "$channel_signature_file" channel-manifest.json

      - name: Checkout installer release-contract gate
        uses: actions/checkout@v4
        with:
          repository: contexa-security/install-ctxa
          ref: 9fefa8fd8162024649aed2132b2770240fba2bc9
          path: installer-contract
          token: ${{ secrets.INSTALLER_ACCEPTANCE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify signed assets and provenance with the install-ctxa contract
        env:
          CONTEXA_RELEASE_BUNDLE_ROOT: ${{ github.workspace }}
        run: >-
          node --test --test-name-pattern
          "CLI release bundle satisfies the installer signature and asset contract"
          installer-contract/test/installers.test.js &&
          node --test --test-name-pattern=CLI.release.bundle
          installer-contract/test/installer-runtime.test.js

      - uses: softprops/action-gh-release@v2
        with:
          name: Contexa CLI ${{ github.ref_name }}
          prerelease: true
          body: |
            ## Install
            ```bash
            curl -fsSL https://install.ctxa.ai | sh
            ```
            The installer verifies the RSA-signed release manifest and the SHA-256 digest bound to each binary.
          files: |
            release-manifest.json
            release-manifest.json.sig
            channel-manifest.json
            channel-manifest.json.sig
            release-signing-public.pem
            dist/contexa-linux-x64/contexa-linux-x64
            dist/contexa-linux-x64/contexa-linux-x64.sha256
            dist/contexa-macos-arm64/contexa-macos-arm64
            dist/contexa-macos-arm64/contexa-macos-arm64.sha256
            dist/contexa-win-x64.exe/contexa-win-x64.exe
            dist/contexa-win-x64.exe/contexa-win-x64.exe.sha256

      - name: Publish signed snapshot channel
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./channel-manifest.json').channel")" = snapshot
          git fetch origin refs/heads/snapshot-channel:refs/remotes/origin/snapshot-channel || true
          manifest_blob="$(git hash-object -w channel-manifest.json)"
          signature_blob="$(git hash-object -w channel-manifest.json.sig)"
          public_key_blob="$(git hash-object -w release-signing-public.pem)"
          channel_tree="$(
            printf '%s\n' \
              "100644 blob $manifest_blob"$'\t'"channel-manifest.json" \
              "100644 blob $signature_blob"$'\t'"channel-manifest.json.sig" \
              "100644 blob $public_key_blob"$'\t'"release-signing-public.pem" |
              git mktree
          )"
          parent="$(git rev-parse --verify refs/remotes/origin/snapshot-channel 2>/dev/null || true)"
          if [ -n "$parent" ]; then
            channel_commit="$(printf 'Publish signed snapshot channel %s\n' "$GITHUB_REF_NAME" |
              git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit-tree "$channel_tree" -p "$parent")"
          else
            channel_commit="$(printf 'Publish signed snapshot channel %s\n' "$GITHUB_REF_NAME" |
              git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit-tree "$channel_tree")"
          fi
          git push origin "$channel_commit":refs/heads/snapshot-channel
